discord:
  token: ${DISCORD_BOT_TOKEN}
  guild-id: ${DISCORD_GUILD_ID}
  confirm-button-enabled: ${DISCORD_CONFIRM_BUTTON_ENABLED:true}
  ask-button-enabled: ${DISCORD_ASK_BUTTON_ENABLED:true}
  ops-channel-id: ${DISCORD_OPS_CHANNEL_ID:}
  ops-role-id: ${DISCORD_OPS_ROLE_ID:}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

github:
  app-id: ${GITHUB_APP_ID}
  private-key-path: ${GITHUB_PRIVATE_KEY_PATH}
  install-url: ${GITHUB_INSTALL_URL}
  connect-timeout: 5s
  read-timeout: 15s

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model: gpt-6.1-terra
  reasoning-effort: low
  timeout: 60s
  max-retries: 2
  max-output-tokens: 8000

summary:
  prompt-version: v4
  max-input-chars: 60000
  daily-max-calls:
    digest: 60
    preview: 30
  daily-max-tokens:
    digest: 1500000
    preview: 500000
  zone: Asia/Seoul
  previous-items:
    lookback-days: 14
    max-items: 30
  excluded-files:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.jks"
    - "**/application-*secret*.yml"
    - "**/application-*secret*.yaml"
    - "**/application-*local*.yml"
    - "**/application-*local*.yaml"
    - "**/credentials"
    - "**/credentials.*"
    - "**/*credentials*.json"
    - "**/*secret*.json"
    - "**/*secret*.yml"
    - "**/*secret*.yaml"
    - "**/*secret*.properties"
  patch-omitted-files:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/*.lock"
    - "**/build/**"
    - "**/dist/**"
    - "**/out/**"
    - "**/node_modules/**"
    - "**/.idea/**"
    - "**/.vscode/**"

schedule:
  zone: Asia/Seoul
  prepare-cron: "0 30 8,20 * * *"
  send-cron: "0 0 9,21 * * *"
  prepare-deadline-before: 2m
  prepare-concurrency: 3
  send-lock-wait: 30s
  recovery-window: 30m
