discord:
  token: ${DISCORD_BOT_TOKEN}
  test-guild-id: ${DISCORD_TEST_GUILD_ID}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create

github:
  app-id: ${GITHUB_APP_ID}
  private-key-path: ${GITHUB_PRIVATE_KEY_PATH}
  install-url: ${GITHUB_INSTALL_URL}
