name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "준비·발송 시간대에도 강제로 배포"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # GHCR push
  id-token: write   # AWS OIDC

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
