name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "준비·발송 시간대에도 강제로 배포"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # GHCR push
  id-token: write   # AWS OIDC

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          ./gradlew clean bootJar -x test
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n1)" app.jar

      - name: Image name (소문자)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/discordmoa" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 준비·발송 시간대 확인 (KST 08:25~09:35, 20:25~21:35)
        if: ${{ !inputs.force }}
        run: |
          hm=$((10#$(TZ=Asia/Seoul date +%H%M)))
          if (( (hm >= 825 && hm <= 935) || (hm >= 2025 && hm <= 2135) )); then
            echo "::error::준비·발송 시간대라 배포를 중단했어요 ($(TZ=Asia/Seoul date +%H:%M) KST). 시간대가 지난 뒤 Re-run 하세요."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: SSM으로 배포 명령 실행
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "moa deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"/opt/moa/deploy.sh ${GITHUB_SHA}\"]" \
            --query Command.CommandId --output text)
          echo "command id: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          [[ "$STATUS" == "Success" ]]
